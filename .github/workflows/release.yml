name: Release SIAMBRUK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing version tag to build, for example v0.1.0"
        required: true
        type: string

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: tauri-app
        run: npm ci

      - name: Verify updater signing secret
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || {
            echo "TAURI_SIGNING_PRIVATE_KEY is not configured."
            exit 1
          }

      - name: Build Tauri app and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: tauri-app
          tagName: ${{ inputs.tag_name || github.ref_name }}
          releaseName: SIAMBRUK ${{ inputs.tag_name || github.ref_name }}
          releaseBody: Automatic signed SIAMBRUK release generated by GitHub Actions.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Verify published latest.json
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p updater-verification
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json \
            --dir updater-verification \
            --clobber
          test -s updater-verification/latest.json
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('updater-verification/latest.json', 'utf8'));
          const platforms = Object.entries(manifest.platforms ?? {});
          if (!manifest.version || platforms.length === 0) throw new Error('latest.json is missing version or platforms');
          for (const [platform, artifact] of platforms) {
            if (!artifact.url || !artifact.signature) throw new Error(`${platform} is missing url or signature`);
          }
          console.log(`latest.json verification passed for ${manifest.version}`);
          NODE
